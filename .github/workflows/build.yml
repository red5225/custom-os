name: Build Custom OS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib nasm grub-pc-bin grub-common xorriso mtools imagemagick
      - name: Build
        run: make -j2
      - name: Validate
        run: |
          grub-file --is-x86-multiboot2 kernel.bin
          test -s custom-os.iso
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-terminal
          path: custom-os.iso
