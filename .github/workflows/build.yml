name: Build OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-i686-linux-gnu binutils-i686-linux-gnu genisoimage file
      - name: Build OS
        run: |
          make clean
          make
          file build/os.iso
          ls -lh build/os.iso build/os.img
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: build/os.iso
      - name: Upload raw disk image
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-raw
          path: build/os.img
