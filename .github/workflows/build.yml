name: Build CustomOS Linux
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio unzip rsync file wget curl python3 python3-pip libncurses-dev libssl-dev libelf-dev xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Run CustomOS host tests
        run: python3 -m unittest discover -s tests -v
      - name: Build Linux kernel and root filesystem
        run: sh ./scripts/build.sh
      - name: Package bootable ISO
        run: |
          mkdir -p iso-root/boot/grub
          cp out/images/bzImage iso-root/boot/bzImage
          cp out/images/rootfs.cpio.gz iso-root/boot/rootfs.cpio.gz
          cat > iso-root/boot/grub/grub.cfg <<'EOF'
          set timeout=0
          set default=0
          menuentry "CustomOS Linux" {
              linux /boot/bzImage console=ttyS0 rdinit=/sbin/init
              initrd /boot/rootfs.cpio.gz
          }
          EOF
          grub-mkrescue -o customos-x86_64.iso iso-root
          test -s customos-x86_64.iso
          sha256sum customos-x86_64.iso | tee customos-x86_64.iso.sha256
          xorriso -indev customos-x86_64.iso -toc >/dev/null
      - name: Boot smoke test in QEMU
        run: |
          set +e
          timeout 60s qemu-system-x86_64 -machine q35 -m 1024 -cdrom customos-x86_64.iso -display none -serial file:qemu-serial.log -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          cat qemu-serial.log
          grep -q "CustomOS Linux Edition" qemu-serial.log
          grep -q "Python:" qemu-serial.log
      - name: Upload bootable image and logs
        uses: actions/upload-artifact@v4
        with:
          name: customos-linux-x86_64
          path: |
            customos-x86_64.iso
            customos-x86_64.iso.sha256
            qemu-serial.log
            out/images/bzImage
            out/images/rootfs.cpio.gz
