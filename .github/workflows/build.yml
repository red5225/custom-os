name: Build Custom OS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build
        run: make

      - name: Validate kernel and ISO
        run: |
          grub-file --is-x86-multiboot build/kernel.bin
          test -s build/custom-os.iso
          ls -lh build/custom-os.iso build/kernel.bin

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-x86-iso
          path: build/custom-os.iso
