name: Build OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build from proven Tiny Core base
        run: |
          make clean
          make
          file build/os.iso
          ls -lh build/os.iso

      - name: Smoke-test ISO with QEMU
        run: |
          set +e
          timeout 12s qemu-system-i386 -cdrom build/os.iso -boot d -display none -monitor none -serial none -no-reboot -no-shutdown
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "QEMU exited unexpectedly with code $rc"
            exit 1
          fi
          echo "Tiny Core ISO stayed running for 12 seconds: boot smoke test passed"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: build/os.iso
