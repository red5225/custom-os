name: Build Custom OS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal x86 ISO tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib grub-pc-bin xorriso mtools

      - name: Build
        run: make -j2

      - name: Validate
        run: |
          grub-file --is-x86-multiboot build/kernel.bin
          test -s build/custom-os.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-x86-iso
          path: build/custom-os.iso
