name: Build CustomOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso mtools
      - name: Build kernel
        run: make
      - name: Build ISO
        run: make iso
      - name: Validate ISO
        run: test -s custom-os.iso
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os
          path: custom-os.iso
