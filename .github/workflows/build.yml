name: Build CustomOS
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - run: sudo apt-get update && sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso
  - run: make
  - run: make iso
  - run: test -s custom-os.iso
  - uses: actions/upload-artifact@v4
    with:
     name: custom-os
     path: custom-os.iso
