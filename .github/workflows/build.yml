name: Native UEFI CustomOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-uefi:
    name: Build original UEFI loader, kernel and XC programs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install UEFI build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gcc g++ gnu-efi mtools dosfstools fdisk xorriso isolinux qemu-system-x86 ovmf
      - name: Compile XC and run positive and negative tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tools/xc/xc.cpp -o /tmp/xc
          test "$(/tmp/xc tests/xc/hello.xc)" = "$(printf 'XC interpreter online\n42')"
          test "$(/tmp/xc tests/xc/condition.xc)" = "condition true"
          test "$(printf 'Nolan\n' | /tmp/xc tests/xc/ask.xc)" = "welcome back"
          test "$(printf 'Other\n' | /tmp/xc tests/xc/ask.xc)" = "hello"
          for f in tests/xc/regression_*.xc apps/examples/*.xc; do /tmp/xc "$f" >/dev/null; done
          if /tmp/xc tests/xc/invalid.xc >/dev/null 2>&1; then echo 'invalid XC program was accepted'; exit 1; fi
          if /tmp/xc tests/xc/bad_value.xc >/dev/null 2>&1; then echo 'invalid XC value was accepted'; exit 1; fi
      - name: Compile XCUI runtime and validate embedded desktop
        run: make xcui-test
      - name: Compile and test all kernel core primitives
        run: |
          set -eu
          for t in tests/core/*_test.c; do
            name=$(basename "$t" _test.c)
            cc -std=c11 -Wall -Wextra -Werror -Ikernel/core "kernel/core/$name.c" "$t" -o "/tmp/$name-test"
            "/tmp/$name-test"
          done
          echo 'All core primitive tests passed.'
      - name: Compile and self-test C++ host utility
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tools/host/os_inspect.cpp -o /tmp/customos-inspect
          /tmp/customos-inspect --self-test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and self-test C# manifest validator
        run: dotnet run --project tools/host/ManifestCheck/ManifestCheck.csproj -- --self-test
      - name: Build native UEFI loader and kernel
        run: make clean all
      - name: Run native boot smoke test
        run: make test
      - name: Report tracked files and image size
        run: |
          printf 'Tracked files: '
          git ls-files | wc -l
          find boot/uefi/build -maxdepth 1 -type f -printf '%f %s bytes\n' || true
      - name: Upload native UEFI outputs
        uses: actions/upload-artifact@v4
        with:
          name: customos-native-uefi
          path: |
            boot/uefi/build/customos.iso
            boot/uefi/build/customos.img
            boot/uefi/build/BOOTX64.EFI
            boot/uefi/build/kernel.elf
            boot/uefi/build/serial.log
            boot/uefi/build/iso-serial.log
          if-no-files-found: error
