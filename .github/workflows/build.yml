name: Native UEFI CustomOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-uefi:
    name: Build original UEFI loader and freestanding kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install UEFI build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils gcc gnu-efi mtools dosfstools qemu-system-x86 ovmf
      - name: Build native UEFI loader and kernel
        run: make clean all
      - name: Run native boot smoke test
        run: make test
      - name: Report source count
        run: |
          printf 'Tracked source files: '
          git ls-files | wc -l
          find milestone1/build -maxdepth 1 -type f -printf '%f %s bytes\\n' 2>/dev/null || true
      - name: Upload native UEFI outputs
        uses: actions/upload-artifact@v4
        with:
          name: customos-native-uefi
          path: milestone1/build/**
          if-no-files-found: error
