name: Build OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso

      - name: Build custom OS with Python
        run: |
          make clean
          make
          file build/os.iso
          ls -lh build/os.iso
          test -f build/iso-root/tce/optional/python3.14.tcz
          grep -qx 'python3.14.tcz' build/iso-root/tce/onboot.lst
          xorriso -indev build/os.iso -toc

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: build/os.iso
