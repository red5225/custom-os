name: Build CustomOS
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso mtools dosfstools
      - name: Build custom kernel
        run: make
      - name: Build ISO
        run: make iso
      - name: Validate
        run: |
          test -s custom-os.iso
          grub-file --is-x86-multiboot2 custom-os.elf
          file custom-os.iso
      - uses: actions/upload-artifact@v4
        with:
          name: custom-os
          path: custom-os.iso
