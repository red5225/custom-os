name: Build custom-os

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils grub-pc-bin grub-common xorriso

      - name: Build ISO
        run: make

      - name: Verify ISO
        run: |
          test -f build/custom-os.iso
          file build/custom-os.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: build/custom-os.iso
          if-no-files-found: error
          retention-days: 30
