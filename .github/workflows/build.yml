name: Build OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso qemu-system-x86

      - name: Build custom OS with Python
        run: |
          make clean
          make
          file build/os.iso
          ls -lh build/os.iso
          test -f build/iso-root/tce/optional/python3.14.tcz
          grep -qx 'python3.14.tcz' build/iso-root/tce/onboot.lst

      - name: Smoke-test ISO with QEMU
        run: |
          set +e
          timeout 12s qemu-system-i386 -cdrom build/os.iso -boot d -display none -monitor none -serial none -no-reboot -no-shutdown
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "QEMU exited unexpectedly with code $rc"
            exit 1
          fi
          echo "Custom OS ISO stayed running for 12 seconds: boot smoke test passed"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: build/os.iso
