name: Build CustomOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools parted qemu-system-x86

      - name: Build kernel and XCL compiler
        run: make

      - name: Build BIOS/Multiboot ISO
        run: make iso

      - name: Build UEFI removable image
        run: make uefi

      - name: Validate boot artifacts
        run: |
          test -s custom-os.iso
          test -s custom-os-uefi.img
          test -s build/BOOTX64.EFI
          grub-file --is-x86-multiboot2 custom-os.elf
          grub-file --is-x86_64-efi build/BOOTX64.EFI
          xorriso -indev custom-os.iso -toc >/dev/null
          file custom-os-uefi.img

      - name: Upload BIOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: custom-os.iso

      - name: Upload UEFI USB image
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-uefi-usb
          path: custom-os-uefi.img
