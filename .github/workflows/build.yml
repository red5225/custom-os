name: Build CustomOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make curl xorriso mtools gdisk qemu-system-x86
      - name: Build kernel and XCL compiler
        run: make
      - name: Build hybrid BIOS/UEFI ISO
        run: make iso
      - name: Build hybrid USB/HDD image
        run: make hdd
      - name: Validate boot artifacts
        run: |
          test -s custom-os.elf
          file custom-os.elf
          readelf -h custom-os.elf | grep 'Advanced Micro Devices X86-64'
          test -s custom-os.iso
          xorriso -indev custom-os.iso -toc >/dev/null
          test -s custom-os.hdd
          file custom-os.hdd
          mdir -i custom-os.hdd@@1048576 ::/boot/limine/ >/dev/null
      - name: Boot smoke test with QEMU
        run: |
          timeout 12s qemu-system-x86_64 -M q35 -m 512M -cdrom custom-os.iso -serial stdio -display none || test $? -eq 124
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso-limine
          path: custom-os.iso
      - name: Upload USB image
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-usb-limine
          path: custom-os.hdd
