name: Build CustomOS Linux
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Host, language, and freestanding-kernel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 curl
      - name: Run CustomOS host tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile freestanding kernel and XCL bootstrap
        run: make clean all
      - name: Compile and test C++ host utility
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tools/host/os_inspect.cpp -o /tmp/customos-inspect
          /tmp/customos-inspect --self-test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test C# manifest validator
        run: dotnet run --project tools/host/ManifestCheck/ManifestCheck.csproj -- --self-test

  build:
    name: Build integrated Linux ISO (main only)
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex cpio unzip rsync wget curl python3 python3-pip libncurses-dev libssl-dev libelf-dev xorriso grub-pc-bin grub-common mtools qemu-system-x86
      - name: Build Linux kernel and root filesystem
        run: sh ./scripts/build.sh
      - name: Package bootable ISO
        run: |
          mkdir -p iso-root/boot/grub
          cp out/images/bzImage iso-root/boot/bzImage
          cp out/images/rootfs.cpio.gz iso-root/boot/rootfs.cpio.gz
          cat > iso-root/boot/grub/grub.cfg <<'EOF'
          set timeout=0
          set default=0
          menuentry "CustomOS / Magneto" {
              linux /boot/bzImage console=tty0 console=ttyS0,115200n8 rdinit=/sbin/init
              initrd /boot/rootfs.cpio.gz
          }
          EOF
          grub-mkrescue -o customos-x86_64.iso iso-root
          test -s customos-x86_64.iso
          iso_bytes=$(stat -c%s customos-x86_64.iso)
          echo "ISO size: ${iso_bytes} bytes"
          test "${iso_bytes}" -lt 209715200
          sha256sum customos-x86_64.iso > customos-x86_64.iso.sha256
      - name: QEMU boot smoke test
        run: |
          set +e
          timeout 60s qemu-system-x86_64 -machine q35 -m 1024 -cdrom customos-x86_64.iso -display none -serial stdio -no-reboot > qemu-serial.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then cat qemu-serial.log; exit "$rc"; fi
          cat qemu-serial.log
          grep -q "CustomOS" qemu-serial.log
      - uses: actions/upload-artifact@v4
        with:
          name: customos-linux-x86_64
          path: |
            customos-x86_64.iso
            customos-x86_64.iso.sha256
            qemu-serial.log
            out/images/bzImage
            out/images/rootfs.cpio.gz
          if-no-files-found: error
